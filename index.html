<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iron Pulse Home Gym Tracker</title>
    <style>
        :root {
            --bg: #0b0f19;
            --surface: #131c2e;
            --surface-card: #1a253a;
            --primary: #00f0ff;
            --secondary: #7000ff;
            --accent: #ff0055;
            --text: #f3f4f6;
            --text-dim: #9ca3af;
            --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding-bottom: 80px; }
        header { background: var(--surface); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top: 0; z-index: 100; }
        h1 { font-size: 1.2rem; color: var(--primary); font-weight: 700; letter-spacing: 0.5px; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .card { background: var(--surface-card); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        h2 { font-size: 1.1rem; margin-bottom: 15px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        label { display: block; font-size: 0.85rem; color: var(--text-dim); margin-bottom: 6px; }
        input, select { width: 100%; background: var(--bg); border: 1px solid rgba(255,255,255,0.15); color: var(--text); padding: 12px; border-radius: 10px; font-size: 1rem; margin-bottom: 15px; }
        button { width: 100%; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: #fff; border: none; padding: 14px; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        button:active { opacity: 0.8; }
        .btn-secondary { background: rgba(255,255,255,0.1); margin-top: 10px; }
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid rgba(255,255,255,0.1); z-index: 100; }
        .nav-item { background: none; border: none; color: var(--text-dim); font-size: 0.8rem; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; width: auto; padding: 0; }
        .nav-item.active { color: var(--primary); }
        .hidden { display: none !important; }
        .flex-row { display: flex; gap: 10px; }
        .badge { background: rgba(0,240,255,0.15); color: var(--primary); padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; display: inline-block; margin-bottom: 10px; }
    </style>
</head>
<body>

    <header>
        <h1 id="app-title">⚡ IRON PULSE HOME GYM</h1>
        <button id="lang-btn" style="width: auto; padding: 6px 12px; font-size: 0.8rem;" onclick="toggleLang()">KR / EN</button>
    </header>

    <div class="container">
        <!-- 1. SETUP / HOME VIEW -->
        <div id="view-setup" class="view">
            <div class="card">
                <h2>👤 사용자 및 장비 세팅</h2>
                <label id="lbl-name">이름</label>
                <input type="text" id="set-name" value="홈짐 마스터">
                
                <label id="lbl-birth">생년월일</label>
                <input type="date" id="set-birth" value="1995-01-01">

                <label id="lbl-split">운동 분할 선택</label>
                <select id="set-split">
                    <option value="ppl">PPL (Push / Pull / Legs) - 격주/교대 A/B</option>
                    <option value="upper_lower">상체 / 하체 (2분할)</option>
                    <option value="bro">5분할 (Bro Split)</option>
                    <option value="fullbody">무분할 (Full Body)</option>
                </select>

                <label>조절식 덤벨 보유 무게 목록 (쉼표로 구분)</label>
                <input type="text" id="set-dumbbells" value="2.5, 5, 7.5, 10, 12.5, 15, 17.5, 20, 22.5, 25">

                <label>케이블 구성</label>
                <select id="set-cable">
                    <option value="dual">듀얼 케이블 (상/하단 고정 2개)</option>
                    <option value="single">싱글 케이블 (상/하단 고정 1개)</option>
                </select>

                <button onclick="saveSetup()">설정 저장 및 운동 시작 🚀</button>
            </div>
        </div>

        <!-- 2. WORKOUT SESSION VIEW -->
        <div id="view-workout" class="view hidden">
            <div class="card">
                <span class="badge" id="current-split-badge">PUSH SESSION (A 세트)</span>
                <h2 id="wo-title">1단계: 유산소 웜업</h2>
                
                <div id="step-warmup">
                    <label>유산소 기구 선택</label>
                    <select id="wu-gear">
                        <option value="treadmill">트레드밀 (Treadmill)</option>
                        <option value="elliptical">일립티컬 (Elliptical)</option>
                    </select>
                    <label>진행 시간 (분)</label>
                    <input type="number" id="wu-time" value="10">
                    <label>도달 심박수 (BPM)</label>
                    <input type="number" id="wu-hr" value="130">
                    <button onclick="nextStep(1)">웜업 완료 및 본운동 진입</button>
                </div>

                <div id="step-main" class="hidden">
                    <div id="exercise-card">
                        <h3 id="ex-name" style="color:var(--primary); margin-bottom:10px;">스미스 머신 벤치 프레스</h3>
                        <p id="ex-target" style="font-size:0.85rem; color:var(--text-dim); margin-bottom:15px;">타겟: 대흉근 / 삼두근</p>
                        
                        <div class="flex-row">
                            <div style="flex:1">
                                <label>중량 (kg)</label>
                                <input type="number" id="ex-weight" value="60">
                            </div>
                            <div style="flex:1">
                                <label>횟수 (Reps)</label>
                                <input type="number" id="ex-reps" value="10">
                            </div>
                        </div>

                        <div class="flex-row">
                            <div style="flex:1">
                                <label>RPE (1~10 강도)</label>
                                <input type="number" id="ex-rpe" min="1" max="10" value="8">
                            </div>
                            <div style="flex:1">
                                <label>심박수 (BPM)</label>
                                <input type="number" id="ex-hr" value="150">
                            </div>
                        </div>

                        <button onclick="completeSet()">세트 완료 및 휴식 시작 ⏱️</button>
                        <button class="btn-secondary" onclick="nextExercise()">다음 운동으로 교체/넘기기</button>
                    </div>
                </div>

                <div id="step-rest" class="hidden" style="text-align: center; padding: 20px;">
                    <h3 style="color: var(--success); margin-bottom: 10px;">휴식 중... ☕</h3>
                    <h1 id="timer-display" style="font-size: 3rem; margin-bottom: 20px;">60</h1>
                    <button onclick="skipRest()">휴식 건너뛰기</button>
                </div>
            </div>
        </div>

        <!-- 3. ANALYTICS & INBODY VIEW -->
        <div id="view-analytics" class="view hidden">
            <div class="card">
                <h2>📊 근육 밸런스 & 인바디 분석</h2>
                <label>체중 (kg)</label>
                <input type="number" id="ib-weight" value="75.0" step="0.1">
                <label>골격근량 (kg)</label>
                <input type="number" id="ib-muscle" value="38.5" step="0.1">
                <label>체지방률 (%)</label>
                <input type="number" id="ib-fat" value="15.2" step="0.1">
                <button onclick="saveInBody()">인바디 기록 저장</button>
            </div>
            <div class="card">
                <h2>💡 홈짐 AI 피드백</h2>
                <p style="font-size: 0.9rem; color: var(--text-dim); line-height: 1.5;">
                    현재 상체(푸시) 세션 볼륨이 하체에 비해 15% 높습니다. 다음 Pull 세트에서 후면 어깨 및 등 운동을 강화하는 것을 추천합니다.
                </p>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav class="nav-bar">
        <button class="nav-item active" onclick="switchTab('setup')">
            <span>⚙️</span> 설정
        </button>
        <button class="nav-item" onclick="switchTab('workout')">
            <span>🔥</span> 운동
        </button>
        <button class="nav-item" onclick="switchTab('analytics')">
            <span>📈</span> 분석/인바디
        </button>
    </nav>

    <script>
        let currentLang = 'KR';
        let workoutState = { step: 'warmup', setIdx: 0 };

        function switchTab(tabId) {
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            if(tabId === 'setup') {
                document.getElementById('view-setup').classList.remove('hidden');
                event.currentTarget.classList.add('active');
            } else if(tabId === 'workout') {
                document.getElementById('view-workout').classList.remove('hidden');
                event.currentTarget.classList.add('active');
            } else if(tabId === 'analytics') {
                document.getElementById('view-analytics').classList.remove('hidden');
                event.currentTarget.classList.add('active');
            }
        }

        function saveSetup() {
            alert('설정이 저장되었습니다! 운동 탭으로 이동합니다.');
            switchTab('workout');
        }

        function nextStep(stage) {
            if(stage === 1) {
                document.getElementById('step-warmup').classList.add('hidden');
                document.getElementById('step-main').classList.remove('hidden');
                document.getElementById('wo-title').innerText = "2단계: 본 운동 (Push A)";
            }
        }

        function completeSet() {
            document.getElementById('step-main').classList.add('hidden');
            document.getElementById('step-rest').classList.remove('hidden');
            let timeLeft = 60;
            const timerEl = document.getElementById('timer-display');
            
            const timer = setInterval(() => {
                timeLeft--;
                timerEl.innerText = timeLeft;
                if(timeLeft <= 0) {
                    clearInterval(timer);
                    skipRest();
                }
            }, 1000);
        }

        function skipRest() {
            document.getElementById('step-rest').classList.add('hidden');
            document.getElementById('step-main').classList.remove('hidden');
            alert('다음 세트를 시작합니다!');
        }

        function nextExercise() {
            alert('다음 운동 종목으로 전환합니다.');
        }

        function saveInBody() {
            alert('인바디 기록이 저장되었습니다.');
        }

        function toggleLang() {
            currentLang = currentLang === 'KR' ? 'EN' : 'KR';
            document.getElementById('app-title').innerText = currentLang === 'KR' ? '⚡ 아이언 펄스 홈짐' : '⚡ IRON PULSE HOME GYM';
        }
    </script>
</body>
</html>
